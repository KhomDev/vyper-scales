[project]
name = "vyper-scales"
version = "0.1.0"
description = "Open evidence tooling for Vyper and DeFi security"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "KhomDev" }]
keywords = ["vyper", "defi", "security", "testing", "smart-contracts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://khomdev.org"
Source = "https://github.com/KhomDev/vyper-scales"
Issues = "https://github.com/KhomDev/vyper-scales/issues"

[project.scripts]
seamcheck = "vyper_scales.seamcheck.cli:main"
vyper-semantic-diff = "vyper_scales.semantic_diff.cli:main"
vyper-sig-matrix = "vyper_scales.sig_matrix.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vyper_scales"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "S", "B", "SIM"]
per-file-ignores = { "**/tests/*" = ["S101", "S105", "S108", "S603"], "src/vyper_scales/semantic_diff/compiler.py" = ["S603"] }

[tool.ruff.format]
quote-style = "double"
